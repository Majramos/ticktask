[project]
name = "ticktask"
version = "0.1.0"
description = "Pomodoro-style terminal task manager"
readme = "README.md"
authors = [
    { name = "Marco Ramos", email = "ticktask@marcoramos.me" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ticktask = "ticktask.main:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.10",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--cov=ticktask --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ticktask"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
